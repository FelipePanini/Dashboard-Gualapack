name: Inspecionar todas as abas (mapeamento)

# Ferramenta temporária da fase de mapeamento: lista todas as abas de todos
# os arquivos da pasta do Drive, com dimensões, cabeçalho e amostras.
# Só leitura — não grava nada no Drive nem no Supabase.
on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend/sync-drive
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install

      - name: Inspecionar
        env:
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node inspect-all.js
