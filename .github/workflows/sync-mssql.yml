name: Carga direta do SQL Server (Metrics)

# Só roda num runner self-hosted, dentro da rede/VPN da Gualapack — o
# GitHub Actions na nuvem não alcança sbrjag-db.br.gpk.gpk-grp.local.
# Ver backend/README-mssql-sync.md pro passo a passo de configuração.
on:
  schedule:
    # 06:30 UTC = 03:30 no horário de Brasília (UTC-3) — meia hora depois
    # do sync-drive.yml, pra não competir se um dia rodarem na mesma hora.
    - cron: "30 6 * * *"
  workflow_dispatch: {} # permite rodar manualmente pela aba "Actions"

jobs:
  sync:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend/sync-mssql
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install

      - name: Rodar a carga
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MSSQL_DOMAIN: ${{ secrets.MSSQL_DOMAIN }}
          MSSQL_USER: ${{ secrets.MSSQL_USER }}
          MSSQL_PASSWORD: ${{ secrets.MSSQL_PASSWORD }}
        run: node sync.js
