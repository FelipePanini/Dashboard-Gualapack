name: Carga automática via SharePoint (pré-montado — inativo)

# Só roda manualmente por enquanto ("Run workflow" na aba Actions), até a TI
# liberar o app no Entra ID e os secrets abaixo serem cadastrados no repo
# (Settings > Secrets and variables > Actions). Depois disso, descomente o
# bloco "schedule" pra rodar sozinho todo dia — ver backend/README-dados.md.
on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "0 6 * * *"   # 06:00 UTC = 03:00 horário de Brasília

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/sync-sharepoint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/sync-sharepoint/package-lock.json

      - run: npm install

      - name: Rodar a carga
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          SHAREPOINT_SITE: ${{ secrets.SHAREPOINT_SITE }}
          SHAREPOINT_FOLDER_PATH: ${{ secrets.SHAREPOINT_FOLDER_PATH }}
        run: node sync.js
