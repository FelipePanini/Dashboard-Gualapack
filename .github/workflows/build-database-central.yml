name: Montar base central (DATABASE_GUALAPACK.xlsx)

# Etapa A da arquitetura combinada: consolida as bases originais do Drive
# num único arquivo (DATABASE_GUALAPACK.xlsx), gravado de volta no Drive.
# Só workflow_dispatch por enquanto — roda manualmente até validarmos o
# arquivo gerado; depois disso entra num schedule antes do sync-drive.yml.
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    # Sem limite, uma execução travada corre até o teto padrão de 6 horas
    # sem avisar — aconteceu ao ler abas de centenas de milhares de linhas.
    timeout-minutes: 50
    defaults:
      run:
        working-directory: backend/sync-drive
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install

      - name: Montar e gravar o arquivo central
        env:
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # A aba "Base Apontamento" do Indicadores Diário 2025 tem 379.792
          # linhas × 25 colunas; com o heap padrão do Node o processo entra em
          # thrashing de GC e não termina.
          NODE_OPTIONS: --max-old-space-size=6144
        run: node build-database-central.js
