<meta charset="UTF-8" />
<title>Atualizar dados — Gualapack</title>

<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600;1,700&family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  color-scheme: light;
  --bg: #eef2f6;
  --surface-1: #ffffff;
  --surface-2: #ffffff;
  --surface-sunken: #e6ecf3;
  --border: #d7e0e9;
  --border-strong: #b9c8d8;
  --text-primary: #0a1524;
  --text-secondary: #3d5066;
  --text-muted: #7288a0;
  --accent: #0f5ea6;
  --accent-ink: #ffffff;
  --accent-soft: #dbeaf8;
  --series-1: #0c3868;
  --series-3: #2f78c4;
  --good: #0d8f4f;
  --good-bg: #dff3e8;
  --warning: #a9720a;
  --warning-bg: #faedd2;
  --critical: #c22b3c;
  --critical-bg: #fbdfe2;
  --glass-bg: rgba(255,255,255,0.6);
  --glass-bg-strong: rgba(255,255,255,0.78);
  --glass-border: rgba(255,255,255,0.65);
  --glass-highlight: rgba(255,255,255,0.9);
  --glass-shadow: 0 1px 1px rgba(10,47,87,0.05), 0 20px 40px -20px rgba(10,47,87,0.28);
  --ease: cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg: #07090c;
    --surface-1: #0e1116;
    --surface-2: #12161d;
    --surface-sunken: #0a0d12;
    --border: #212833;
    --border-strong: #303b4a;
    --text-primary: #eef3f9;
    --text-secondary: #a7b7c9;
    --text-muted: #6d7d90;
    --accent: #4f9ce0;
    --accent-ink: #071019;
    --accent-soft: #132639;
    --series-1: #175a99;
    --series-3: #4f9ce0;
    --good: #2fbf2f;
    --good-bg: #16301a;
    --warning: #e0a834;
    --warning-bg: #382d10;
    --critical: #e66767;
    --critical-bg: #3a1616;
    --glass-bg: rgba(20,26,36,0.5);
    --glass-bg-strong: rgba(24,30,41,0.68);
    --glass-border: rgba(146,180,214,0.16);
    --glass-highlight: rgba(255,255,255,0.06);
    --glass-shadow: 0 1px 1px rgba(0,0,0,0.3), 0 24px 48px -20px rgba(0,0,0,0.65);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg: #07090c;
  --surface-1: #0e1116;
  --surface-2: #12161d;
  --surface-sunken: #0a0d12;
  --border: #212833;
  --border-strong: #303b4a;
  --text-primary: #eef3f9;
  --text-secondary: #a7b7c9;
  --text-muted: #6d7d90;
  --accent: #4f9ce0;
  --accent-ink: #071019;
  --accent-soft: #132639;
  --series-1: #175a99;
  --series-3: #4f9ce0;
  --good: #2fbf2f;
  --good-bg: #16301a;
  --warning: #e0a834;
  --warning-bg: #382d10;
  --critical: #e66767;
  --critical-bg: #3a1616;
  --glass-bg: rgba(20,26,36,0.5);
  --glass-bg-strong: rgba(24,30,41,0.68);
  --glass-border: rgba(146,180,214,0.16);
  --glass-highlight: rgba(255,255,255,0.06);
  --glass-shadow: 0 1px 1px rgba(0,0,0,0.3), 0 24px 48px -20px rgba(0,0,0,0.65);
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
html:focus, body:focus, html:focus-visible, body:focus-visible{ outline: none; }
body{
  background: var(--bg);
  color: var(--text-primary);
  font-family: "Public Sans", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height:100vh;
}
body.auth-pending{ visibility:hidden; }
h1,h2{ font-family:"Archivo","Public Sans",sans-serif; letter-spacing:-0.01em; margin:0; }
.mono{ font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric: tabular-nums; }

.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:18px 28px; border-bottom:1px solid var(--glass-border);
  background: var(--glass-bg); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
  position: sticky; top:0; z-index:10;
}
.brand-word{ font-family:"Playfair Display","Georgia",serif; font-style:italic; font-weight:700; font-size:19px; }
.brand-word .ink-accent{ color:var(--accent); }
.back-link{
  display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--text-secondary);
  text-decoration:none; background:var(--glass-bg-strong); border:1px solid var(--glass-border);
  padding:8px 14px; border-radius:999px; transition: color .2s var(--ease), border-color .2s var(--ease);
}
.back-link:hover{ color:var(--text-primary); border-color:var(--accent); }
.theme-toggle{
  width:36px; height:36px; border-radius:50%; border:1px solid var(--glass-border);
  background:var(--glass-bg-strong); color:var(--text-secondary); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition: border-color .2s var(--ease), color .2s var(--ease);
}
.theme-toggle:hover{ border-color:var(--accent); color:var(--text-primary); }
::view-transition-old(root), ::view-transition-new(root){ animation:none; mix-blend-mode:normal; }
::view-transition-old(root){ z-index:1; } ::view-transition-new(root){ z-index:2; }

.content{ padding:28px; max-width:1040px; margin:0 auto; }
.page-title{ font-size:24px; margin-bottom:4px; }
.page-sub{ color:var(--text-muted); font-size:13.5px; margin-bottom:26px; }

.panel{
  background: var(--glass-bg);
  backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%);
  border:1px solid var(--glass-border); border-radius:14px;
  box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-highlight);
  padding:22px 24px; margin-bottom:20px;
}
.panel h2{ font-size:16px; margin-bottom:4px; }
.panel .sub{ color:var(--text-muted); font-size:12.5px; margin-bottom:18px; }

.dropzone{
  border:2px dashed var(--glass-border); border-radius:14px; padding:36px 20px;
  background: var(--glass-bg-strong); display:flex; flex-direction:column; align-items:center; gap:10px;
  text-align:center; transition: border-color .2s var(--ease), background .2s var(--ease);
  cursor:pointer;
}
.dropzone.drag-over{ border-color:var(--accent); background: var(--accent-soft); }
.dropzone svg{ color:var(--text-muted); }
.dropzone .dz-title{ font-size:14.5px; font-weight:700; }
.dropzone .dz-sub{ font-size:12px; color:var(--text-muted); }
.dropzone input[type=file]{ display:none; }

.file-rows{ display:flex; flex-direction:column; gap:10px; margin-top:18px; }
.file-row{
  border:1px solid var(--glass-border); border-radius:12px; padding:14px 16px;
  background: var(--glass-bg-strong); display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.file-row .fr-name{ font-size:13px; font-weight:600; flex:1 1 220px; min-width:0; overflow-wrap:break-word; }
.file-row .fr-controls{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.file-row select{
  border:1px solid var(--glass-border); border-radius:8px; padding:7px 9px; font-size:12.5px;
  background: var(--surface-1); color:var(--text-primary); font-family:inherit; max-width:220px;
}
.file-row .send-btn{
  background: linear-gradient(155deg, var(--series-3), var(--accent) 65%, var(--series-1));
  color:var(--accent-ink); border:none; border-radius:8px; padding:7px 14px; font-size:12.5px; font-weight:700;
  cursor:pointer; font-family:inherit;
}
.file-row .send-btn:disabled{ opacity:.6; cursor:not-allowed; }
.file-row .fr-status{ font-size:12px; flex-basis:100%; }
.file-row .fr-status.ok{ color:var(--good); }
.file-row .fr-status.error{ color:var(--critical); }
.file-row .fr-status.pending{ color:var(--text-secondary); }
.file-row .fr-badge{
  font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
  padding:3px 8px; border-radius:99px; background:var(--accent-soft); color:var(--accent);
}
.spinner{
  width:12px; height:12px; border-radius:50%; border:2px solid var(--glass-border);
  border-top-color: var(--accent); display:inline-block; margin-right:6px; vertical-align:-2px;
  animation: spin .7s linear infinite;
}
@keyframes spin{ to{ transform: rotate(360deg); } }

.log-list{ display:flex; flex-direction:column; gap:8px; max-height:280px; overflow-y:auto; }
.log-row{ display:flex; justify-content:space-between; gap:12px; font-size:12.5px; padding:8px 10px; border-radius:8px; background: var(--surface-1); border:1px solid var(--border); }
.log-row .when{ color:var(--text-muted); font-size:11px; white-space:nowrap; }
.log-row.ok{ border-color: var(--good); }
.log-row.error{ border-color: var(--critical); color:var(--critical); }

.empty-state, .denied, .loading-state{ color:var(--text-muted); font-size:13.5px; padding:20px 0; text-align:center; }
.denied{ color:var(--critical); }
</style>
</head>
<body class="auth-pending">

<script>
(function(){
  const root = document.documentElement;
  const STORAGE_KEY = "gualapack-theme";
  function systemPrefersDark(){ return window.matchMedia("(prefers-color-scheme: dark)").matches; }
  function effectiveTheme(){
    const explicit = root.getAttribute("data-theme");
    if(explicit === "light" || explicit === "dark") return explicit;
    return systemPrefersDark() ? "dark" : "light";
  }
  let saved = null;
  try{ saved = localStorage.getItem(STORAGE_KEY); }catch(e){}
  root.setAttribute("data-theme", saved === "light" || saved === "dark" ? saved : effectiveTheme());

  document.addEventListener("DOMContentLoaded", ()=>{
    const btn = document.getElementById("theme-toggle");
    if(!btn) return;
    const sunIcon = document.getElementById("theme-icon-sun");
    const moonIcon = document.getElementById("theme-icon-moon");
    function updateIcon(theme){
      const showSun = theme === "dark";
      sunIcon.hidden = !showSun;
      moonIcon.hidden = showSun;
      btn.title = showSun ? "Mudar para tema claro" : "Mudar para tema escuro";
    }
    function applyTheme(theme){
      root.setAttribute("data-theme", theme);
      try{ localStorage.setItem(STORAGE_KEY, theme); }catch(e){}
      updateIcon(theme);
    }
    updateIcon(effectiveTheme());
    btn.addEventListener("click", ()=>{
      const next = effectiveTheme() === "dark" ? "light" : "dark";
      if(window.matchMedia("(prefers-reduced-motion: reduce)").matches || !document.startViewTransition){
        applyTheme(next);
        return;
      }
      const rect = btn.getBoundingClientRect();
      const x = rect.left + rect.width/2, y = rect.top + rect.height/2;
      const endRadius = Math.hypot(Math.max(x, window.innerWidth-x), Math.max(y, window.innerHeight-y));
      const transition = document.startViewTransition(()=> applyTheme(next));
      transition.ready.then(()=>{
        root.animate(
          { clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${endRadius}px at ${x}px ${y}px)`] },
          { duration: 680, easing: "cubic-bezier(.65,0,.35,1)", pseudoElement: "::view-transition-new(root)" }
        );
      });
    });
  });
})();
</script>

<script>
(function(){
  const cfg = window.SUPABASE_CONFIG;
  const configured = cfg && !cfg.url.includes("SEU-PROJETO");
  if(!configured){
    document.addEventListener("DOMContentLoaded", ()=> document.body.classList.remove("auth-pending"));
    return;
  }
  window.gualapackAuth = window.supabase.createClient(cfg.url, cfg.anonKey);
  window.gualapackAuth.auth.getSession().then(({ data })=>{
    if(!data.session){
      window.location.replace("./login.html");
      return;
    }
    window.gualapackSession = data.session;
    document.body.classList.remove("auth-pending");
    document.dispatchEvent(new CustomEvent("gualapack-session-ready"));
  });
})();
</script>

<header class="topbar">
  <div class="brand-word">Guala<span class="ink-accent">pack</span></div>
  <div style="display:flex; align-items:center; gap:10px;">
    <button class="theme-toggle" id="theme-toggle" type="button" title="Trocar tema" aria-label="Trocar tema">
      <svg id="theme-icon-sun" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8L6 18M18 6l1.8-1.8"/></svg>
      <svg id="theme-icon-moon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" hidden><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
    </button>
    <a class="back-link" href="./index.html">&larr; Voltar ao painel</a>
  </div>
</header>

<main class="content">
  <h1 class="page-title">Atualizar dados</h1>
  <div class="page-sub">Arraste todas as planilhas do dia de uma vez &mdash; o sistema identifica sozinho qual indicador é cada uma. Restrito a administradores.</div>

  <div id="root">
    <div class="loading-state">Verificando permissão...</div>
  </div>
</main>

<script>
(function(){
  const cfg = window.SUPABASE_CONFIG;
  const configured = cfg && !cfg.url.includes("SEU-PROJETO");
  const root = document.getElementById("root");

  if(!configured){
    root.innerHTML = `<div class="denied">Backend não configurado ainda (demo/supabase-config.js). Esta tela só funciona com o Supabase conectado.</div>`;
    return;
  }

  const client = window.gualapackAuth;

  // Cada tabela: rótulo, e palavras-chave (já normalizadas) que identificam o
  // arquivo pelo nome, e palavras-chave que identificam a aba certa dentro
  // dele quando há mais de uma. Ordem importa: a primeira regra que bater
  // no nome do arquivo vence (por isso "sequenciamento" vem antes de
  // "aparas" sozinho, senão pegaria os arquivos errados).
  const TABLES = [
    { table: "fardos_aparas", label: "Fardos de aparas", fileKeywords: ["sequenciamento"], sheetKeywords: ["completos", "base_aparas_total"] },
    { table: "aderencia_maquinas_diaria", label: "Aderência — máquinas (diário)", fileKeywords: ["aderencia_maquinas", "aderenciamaquinas"], sheetKeywords: ["apontamentos_producao"] },
    { table: "aderencia_programacao", label: "Aderência — programação", fileKeywords: ["historico_aderencia", "aderencia_programacao"], sheetKeywords: ["programacao_passado"] },
    { table: "refugo_aparas_historico", label: "Refugo/aparas — histórico", fileKeywords: ["refugo_aparas"], sheetKeywords: ["historico_refugo"] },
    { table: "tendencia_mensal", label: "Tendência mensal", fileKeywords: ["tendencia", "grafico"], sheetKeywords: ["dados_prod"] },
    { table: "maquinas", label: "Catálogo de máquinas", fileKeywords: ["machine_card"], sheetKeywords: ["dim_eqtos"] },
    { table: "apontamentos", label: "Apontamentos", fileKeywords: ["indicadores", "base_aparas"], sheetKeywords: ["base_maquina", "base_detalhe"] },
  ];
  const TABLE_BY_KEY = Object.fromEntries(TABLES.map(t=> [t.table, t]));

  function normalize(s){
    return String(s || "")
      .normalize("NFD").replace(/[̀-ͯ]/g, "")
      .toLowerCase()
      .replace(/\.(xlsx|xls|csv)$/i, "")
      .replace(/[^a-z0-9]+/g, "_")
      .replace(/^_+|_+$/g, "");
  }

  function detectTable(fileName){
    const norm = normalize(fileName);
    for(const t of TABLES){
      if(t.fileKeywords.some(k=> norm.includes(k))) return t.table;
    }
    return null;
  }

  function detectSheet(tableKey, sheetNames){
    const cfg = TABLE_BY_KEY[tableKey];
    if(!cfg) return sheetNames[0];
    const byKeyword = sheetNames.find(n=> cfg.sheetKeywords.some(k=> normalize(n).includes(k)));
    return byKeyword || sheetNames[0];
  }

  const REMEMBER_KEY = "gualapack-upload-sheet-choice";
  function rememberedSheet(tableKey, sheetNames){
    try{
      const saved = JSON.parse(localStorage.getItem(REMEMBER_KEY) || "{}");
      return saved[tableKey] && sheetNames.includes(saved[tableKey]) ? saved[tableKey] : null;
    }catch(e){ return null; }
  }
  function rememberSheet(tableKey, sheetName){
    try{
      const saved = JSON.parse(localStorage.getItem(REMEMBER_KEY) || "{}");
      saved[tableKey] = sheetName;
      localStorage.setItem(REMEMBER_KEY, JSON.stringify(saved));
    }catch(e){}
  }

  function fmtTime(d){
    return d.toLocaleTimeString("pt-BR", { hour:"2-digit", minute:"2-digit", second:"2-digit" });
  }

  function fileToBase64(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = ()=> resolve(reader.result.split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  const uploadLog = [];
  function pushLog(entry){
    uploadLog.unshift({ ...entry, when: new Date() });
    renderLog();
  }
  function renderLog(){
    const list = document.getElementById("log-list");
    const empty = document.getElementById("log-empty");
    if(!list) return;
    if(uploadLog.length === 0){
      list.innerHTML = "";
      if(empty) empty.style.display = "block";
      return;
    }
    if(empty) empty.style.display = "none";
    list.innerHTML = uploadLog.map(e=>`
      <div class="log-row ${e.ok ? "ok" : "error"}">
        <span>${e.text}</span>
        <span class="when">${fmtTime(e.when)}</span>
      </div>
    `).join("");
  }

  async function sendFile(rowEl, tableKey, file, sheetName){
    const statusEl = rowEl.querySelector(".fr-status");
    const sendBtn = rowEl.querySelector(".send-btn");
    if(sendBtn) sendBtn.disabled = true;
    statusEl.className = "fr-status pending";
    statusEl.innerHTML = `<span class="spinner"></span>Enviando${sheetName ? ` (aba "${sheetName}")` : ""}...`;

    const label = TABLE_BY_KEY[tableKey]?.label || tableKey;

    try{
      const contentBase64 = await fileToBase64(file);
      const { data, error } = await client.functions.invoke("ingest", {
        body: { table: tableKey, fileName: file.name, sheetName, contentBase64 },
      });

      if(error || !data?.ok){
        const msg = data?.error || error?.message || "erro desconhecido";
        statusEl.className = "fr-status error";
        statusEl.textContent = "Falhou: " + msg;
        pushLog({ ok:false, text: `${label}: ${file.name} — ${msg}` });
        return;
      }

      if(sheetName) rememberSheet(tableKey, sheetName);
      statusEl.className = "fr-status ok";
      statusEl.textContent = `${data.linhas} linhas gravadas (aba "${data.sheet}").`;
      pushLog({ ok:true, text: `${label}: ${file.name} [${data.sheet}] — ${data.linhas} linhas` });
    }catch(err){
      statusEl.className = "fr-status error";
      statusEl.textContent = "Falhou: " + err.message;
      pushLog({ ok:false, text: `${label}: ${file.name} — ${err.message}` });
    }finally{
      if(sendBtn) sendBtn.disabled = false;
    }
  }

  function tableOptionsHtml(selected){
    return TABLES.map(t=> `<option value="${t.table}" ${t.table===selected?"selected":""}>${t.label}</option>`).join("");
  }

  async function handleOneFile(file){
    const rows = document.getElementById("file-rows");
    const row = document.createElement("div");
    row.className = "file-row";
    row.innerHTML = `
      <div class="fr-name">${file.name}</div>
      <div class="fr-controls">
        <span class="fr-badge">detectando…</span>
      </div>
      <div class="fr-status pending"><span class="spinner"></span>Analisando arquivo...</div>
    `;
    rows.prepend(row);

    const controls = row.querySelector(".fr-controls");
    const statusEl = row.querySelector(".fr-status");
    const detectedTable = detectTable(file.name);

    // .csv não tem abas.
    if(/\.csv$/i.test(file.name)){
      controls.innerHTML = `<select class="table-select">${tableOptionsHtml(detectedTable)}</select>`;
      const tableSelect = controls.querySelector(".table-select");
      statusEl.className = "fr-status";
      statusEl.textContent = "";
      await sendFile(row, tableSelect.value, file, undefined);
      tableSelect.addEventListener("change", ()=> sendFile(row, tableSelect.value, file, undefined));
      return;
    }

    try{
      const buffer = await file.arrayBuffer();
      const workbook = XLSX.read(buffer, { type: "array", bookSheets: true });
      const sheetNames = workbook.SheetNames;
      const tableKey = detectedTable || TABLES[0].table;
      const chosenSheet = rememberedSheet(tableKey, sheetNames) || detectSheet(tableKey, sheetNames);
      const ambiguous = sheetNames.length > 1;

      controls.innerHTML = `
        <select class="table-select">${tableOptionsHtml(tableKey)}</select>
        ${ambiguous ? `<select class="sheet-select">${sheetNames.map(n=> `<option value="${n}" ${n===chosenSheet?"selected":""}>${n}</option>`).join("")}</select>` : ""}
        <button class="send-btn" type="button">${ambiguous ? "Enviar" : "Reenviar"}</button>
      `;
      const tableSelect = controls.querySelector(".table-select");
      const sheetSelect = controls.querySelector(".sheet-select");
      const sendBtn = controls.querySelector(".send-btn");

      const doSend = ()=> sendFile(row, tableSelect.value, file, sheetSelect ? sheetSelect.value : chosenSheet);
      sendBtn.addEventListener("click", doSend);

      if(!detectedTable){
        statusEl.className = "fr-status error";
        statusEl.textContent = `Não reconheci esse arquivo pelo nome — escolha o indicador certo e clique em Enviar.`;
        return;
      }

      statusEl.className = "fr-status";
      statusEl.textContent = ambiguous ? `${sheetNames.length} abas encontradas — confira a aba selecionada e clique em Enviar.` : "";

      if(!ambiguous){
        await sendFile(row, tableKey, file, chosenSheet);
      }
    }catch(err){
      controls.innerHTML = `<select class="table-select">${tableOptionsHtml(detectedTable)}</select>`;
      statusEl.className = "fr-status error";
      statusEl.textContent = "Não consegui ler o arquivo: " + err.message;
    }
  }

  function handleFiles(fileList){
    Array.from(fileList).forEach(handleOneFile);
  }

  function renderShell(){
    root.innerHTML = `
      <div class="panel">
        <h2>Enviar planilhas</h2>
        <div class="sub">Arraste todas as planilhas do dia de uma vez — o sistema identifica sozinho qual indicador é cada uma pelo nome do arquivo. Aceita .xlsx, .xls e .csv.</div>
        <div class="dropzone" id="dropzone">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v12M7 10l5-5 5 5"/><path d="M5 21h14"/></svg>
          <div class="dz-title">Arraste os arquivos aqui</div>
          <div class="dz-sub">ou clique para escolher (pode selecionar vários de uma vez)</div>
          <input type="file" id="file-input" accept=".xlsx,.xls,.csv" multiple />
        </div>
        <div class="file-rows" id="file-rows"></div>
      </div>
      <div class="panel">
        <h2>Últimos envios</h2>
        <div class="sub">Histórico desta sessão (não persiste ao recarregar a página).</div>
        <div class="log-list" id="log-list"></div>
        <div class="empty-state" id="log-empty">Nenhum envio ainda.</div>
      </div>
    `;
    const dz = document.getElementById("dropzone");
    const input = document.getElementById("file-input");
    dz.addEventListener("click", ()=> input.click());
    input.addEventListener("change", ()=>{ handleFiles(input.files); input.value = ""; });
    ["dragenter","dragover"].forEach(evt=> dz.addEventListener(evt, (e)=>{ e.preventDefault(); dz.classList.add("drag-over"); }));
    ["dragleave","drop"].forEach(evt=> dz.addEventListener(evt, (e)=>{ e.preventDefault(); dz.classList.remove("drag-over"); }));
    dz.addEventListener("drop", (e)=>{ if(e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });
    renderLog();
  }

  async function init(){
    const session = window.gualapackSession;
    if(!session){ root.innerHTML = `<div class="denied">Sessão não encontrada.</div>`; return; }

    const { data: profile, error: profileError } = await client
      .from("profiles")
      .select("role, full_name")
      .eq("id", session.user.id)
      .single();

    if(profileError || !profile || profile.role !== "admin"){
      root.innerHTML = `<div class="denied">Acesso restrito a administradores. Sua conta (${profile?.full_name ?? session.user.email}) não tem essa permissão.</div>`;
      return;
    }

    renderShell();
  }

  if(window.gualapackSession){
    init();
  }else{
    document.addEventListener("gualapack-session-ready", init);
  }
})();
</script>
</body>
</html>
