# Recorte (como o Gráficos Tendência agrupa) -> máquinas.
# Feito à mão até o Machine Card entrar como fonte. A composição de cada
# recorte precisa ser confirmada com o dono da planilha: se o Gráficos
# Tendência junta máquinas diferentes, o TMR do hub vai divergir por isso.
recortes:
  Flexo: [R18, R20]
  R18: [R18]
  R20: [R20]
  Roto: [RT01]
  Laminação: [L02, L03, L04]
  L04: [L04]
  Corte: [REB 01, REB 04, REB 05, REB 09, REB 10]
