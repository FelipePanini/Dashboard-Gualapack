# ============================================================================
# Catálogo de indicadores (vai pro git).
#
# Cada indicador tem UMA fonte oficial e uma definição escrita. O hub não
# escolhe valor: ele mede cada fonte com a regra declarada aqui e compara
# com a oficial. Mudou a regra? Suba a versão; a anterior fica no histórico.
#
# Enquanto o cálculo do hub ("hub.calculo") não bate com a planilha, a
# planilha é a oficial e o hub é a conferência. Quando bater por um mês
# inteiro, o dono decide inverter.
#
# Campos: codigo, versao, nome, unidade (pct|kg|h), grao, dono, definicao,
# fonte_oficial, tolerancia_abs / tolerancia_pct, status_definicao
# (rascunho | em_validacao | oficial), notas, medicoes[fonte, regra, usa].
# ============================================================================

indicadores:
  - codigo: TMR_PCT
    versao: 1
    nome: TMR (tempo de máquina rodando)
    unidade: pct
    grao: mes x recorte
    dono: superior imediato de Produção
    definicao: >
      Horas classificadas como PRODUZINDO no cadastro oficial ÷ horas
      apontadas no recorte e no mês, sem as horas de FIM TURNO. Apontamentos
      do BI Dados de Produção (tabela Dados).
    fonte_oficial: graficos.tmr
    tolerancia_abs: 1.0            # pontos percentuais
    status_definicao: em_validacao
    notas: >
      Resolvido por evidência em 24/09: com os apontamentos do BI e FIM TURNO
      fora do total, o hub reproduz a planilha (Corte igual em todos os meses;
      R18, L04 e Roto com erro médio abaixo de 0,3 p.p.; Laminação = L02+L03+L04).
      A divergência vinha da Base Apontamento do Indicadores Diário, que está
      com apontamentos faltando — ver HORAS_APONTADAS.
      Divergência que é da PLANILHA: o recorte Flexo do Gráficos Tendência muda
      de composição. Em jan, fev e ago é R18+R20; em mar, abr, mai e jul inclui
      também a R12 (bate exato com R12: 35,9 / 31,0 / 38,0 / 32,8). A R12 é do
      grupo FUNGICIDA no Machine Card. Confirmar com o dono qual é o certo.
      Ainda a entender: Laminação em março (planilha 35,8% x 39,1%).
      O painel web atual usa outra regra (desconta todo PLANEJADO do total).
    medicoes:
      - fonte: graficos.tmr
        regra: indicadores/tmr_referencia.sql
      - fonte: hub.calculo
        regra: indicadores/tmr_hub.sql
        usa: [pbi.apontamentos, indicadores.classificacao]

  - codigo: SETUP_PCT
    versao: 1
    nome: Horas em setup
    unidade: pct
    grao: mes x recorte
    dono: superior imediato de Produção
    definicao: Horas com classe SETUP ÷ horas apontadas no recorte e no mês, sem FIM TURNO.
    fonte_oficial: graficos.tmr
    tolerancia_abs: 1.0
    status_definicao: em_validacao
    medicoes:
      - fonte: graficos.tmr
        regra: indicadores/setup_referencia.sql
      - fonte: hub.calculo
        regra: indicadores/setup_hub.sql
        usa: [pbi.apontamentos, indicadores.classificacao]

  - codigo: INATIVO_PCT
    versao: 1
    nome: Horas inativas
    unidade: pct
    grao: mes x recorte
    dono: superior imediato de Produção
    definicao: Horas com classe INATIVIDADE ÷ horas apontadas no recorte e no mês, sem FIM TURNO.
    fonte_oficial: graficos.tmr
    tolerancia_abs: 1.0
    status_definicao: em_validacao
    medicoes:
      - fonte: graficos.tmr
        regra: indicadores/inativo_referencia.sql
      - fonte: hub.calculo
        regra: indicadores/inativo_hub.sql
        usa: [pbi.apontamentos, indicadores.classificacao]

  - codigo: HORAS_APONTADAS
    versao: 1
    nome: Horas apontadas
    unidade: h
    grao: mes x recorte
    dono: superior imediato de Produção
    definicao: >
      Soma das horas de todos os apontamentos das máquinas do recorte no mês.
      BI e Indicadores Diário leem a mesma view do SQL Server: mês fechado
      precisa bater. Diferença aqui é linha faltando ou sobrando numa das cópias.
    fonte_oficial: pbi.apontamentos
    tolerancia_pct: 0.01           # 1%
    status_definicao: oficial
    medicoes:
      - fonte: pbi.apontamentos
        regra: indicadores/horas_bi.sql
      - fonte: indicadores.base_apontamento
        regra: indicadores/horas_excel.sql

  - codigo: VELOCIDADE_M_MIN
    versao: 1
    nome: Velocidade
    unidade: m_min
    grao: mes x maquina
    dono: superior imediato de Produção
    definicao: >
      Metros produzidos ÷ minutos produzindo, pela medida "Velocidade" do BI
      Dados de Produção: (SUM(Qtd Produzida) / SUM(Horas Produzindo)) / 60.
    fonte_oficial: pbi.vazao
    tolerancia_pct: 0.05           # 5%: o BI data a OP pelo último dia, o Machine Card por dia
    status_definicao: em_validacao
    notas: >
      O valor comparado é a regra que o painel web usa hoje (Machine Card,
      Produção (Metros)). Divergência aqui = o painel mostra outra velocidade.
    medicoes:
      - fonte: pbi.vazao
        regra: indicadores/velocidade_bi.sql
      - fonte: hub.calculo
        regra: indicadores/velocidade_machine_card.sql
        usa: [machine_card.producao_metros]

  - codigo: PRODUCAO_KG
    versao: 1
    nome: Produção do mês
    unidade: kg
    grao: mes
    dono: superior imediato de Produção
    definicao: Produção total do mês em kg, como o Power BI fecha.
    fonte_oficial: sequenciamento.scrap_bi
    tolerancia_pct: 0.005          # 0,5%
    status_definicao: oficial
    notas: >
      O Gráficos Tendência copia esse número no bloco "Volume Corte (JGR + OF)".
      A comparação pega erro de cópia entre as duas planilhas.
    medicoes:
      - fonte: sequenciamento.scrap_bi
        regra: indicadores/producao_kg_bi.sql
      - fonte: graficos.volume_corte
        regra: indicadores/producao_kg_graficos.sql

  - codigo: SCRAP_PCT
    versao: 1
    nome: Scrap confirmado
    unidade: pct
    grao: mes
    dono: superior imediato de Produção
    definicao: Refugo total ÷ produção do mês, os dois como o Power BI fecha.
    fonte_oficial: sequenciamento.scrap_bi
    status_definicao: oficial
    notas: >
      Fonte única no MVP: conferidos só faixa (0–100%) e frescor. Não comparar
      com a apara de fardos: é outra definição, com escala 4 a 5 vezes menor.
    medicoes:
      - fonte: sequenciamento.scrap_bi
        regra: indicadores/scrap_pct_bi.sql
