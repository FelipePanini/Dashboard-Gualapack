# ============================================================================
# Catálogo de indicadores (vai pro git).
#
# Cada indicador tem UMA fonte oficial e uma definição escrita. O hub não
# escolhe valor: ele mede cada fonte com a regra declarada aqui e compara
# com a oficial. Mudou a regra? Suba a versão; a anterior fica no histórico.
#
# Enquanto o cálculo do hub ("hub.calculo") não bate com a planilha, a
# planilha é a oficial e o hub é a conferência. Quando bater por um mês
# inteiro, o dono decide inverter.
#
# Campos: codigo, versao, nome, unidade (pct|kg|h), grao, dono, definicao,
# fonte_oficial, tolerancia_abs / tolerancia_pct, status_definicao
# (rascunho | em_validacao | oficial), notas, medicoes[fonte, regra, usa].
# ============================================================================

indicadores:
  # --- O que o painel mostra: regras do BI Indicadores Produção -----------------
  # O painel usa o cálculo das planilhas (chegam todo dia pela cópia automática);
  # o BI é a fonte oficial e a conferência. Mesmas tabelas dos dois lados.
  - codigo: TMR_PCT
    versao: 2
    nome: TMR (tempo de máquina rodando)
    unidade: pct
    grao: mes x recorte
    dono: superior imediato de Produção
    definicao: >
      Horas PRODUZINDO ÷ horas totais sem FIM TURNO e sem INATIVIDADE (medidas
      Horas Produzindo e Horas Totais do BI Indicadores Produção). Tabela Horas
      do Machine Card, com a classificação de cada apontamento. TOTAL = todas as
      máquinas, como o cartão TMR do BI.
    fonte_oficial: pbi_ind.machine_card
    tolerancia_abs: 0.1            # pontos percentuais
    status_definicao: oficial
    notas: >
      Regra do BI escolhida pelo dono em 25/09 (o Gráficos Tendência usa outra:
      só tira FIM TURNO; ver TMR_GRAFICOS_PCT). Planilha e BI leem a mesma
      tabela: meses fechados precisam bater.
    medicoes:
      - fonte: pbi_ind.machine_card
        regra: indicadores/tmr_bi_indicadores.sql
      - fonte: hub.calculo
        regra: indicadores/tmr_machine_card.sql
        usa: [machine_card.horas, machine_card_2025.horas]

  - codigo: VELOCIDADE_MEDIA_M_MIN
    versao: 1
    nome: Velocidade média
    unidade: m_min
    grao: mes x recorte
    dono: superior imediato de Produção
    definicao: >
      Metros produzidos ÷ horas PRODUZINDO ÷ 60 (medida VelMédia do BI
      Indicadores Produção). Tabela Horas do Machine Card.
    fonte_oficial: pbi_ind.machine_card
    tolerancia_pct: 0.005
    status_definicao: oficial
    medicoes:
      - fonte: pbi_ind.machine_card
        regra: indicadores/velocidade_media_bi_indicadores.sql
      - fonte: hub.calculo
        regra: indicadores/velocidade_media_machine_card.sql
        usa: [machine_card.horas, machine_card_2025.horas]

  - codigo: APARA_APONTADA_PCT
    versao: 2
    nome: Apara apontada
    unidade: pct
    grao: mes
    dono: Aparas
    definicao: >
      Refugo apontado ÷ (refugo + peso bruto das REBs) (medida "% Apontada_Geral
      REBS", gráfico Perda GPK do BI Indicadores Produção). Tabela BASE_PROD do
      Base Aparas; peso bruto das REBs pela coluna MÁQUINA REAL.
    fonte_oficial: pbi_ind.aparas_processo
    tolerancia_abs: 0.05
    status_definicao: oficial
    notas: >
      A v1 era a apara dos fardos (peso bruto − líquido), que o painel usava
      com o nome de "apontado": outra coisa, hoje em APARA_FARDOS_PCT.
    medicoes:
      - fonte: pbi_ind.aparas_processo
        regra: indicadores/apara_bi_indicadores.sql
      - fonte: hub.calculo
        regra: indicadores/apara_bi_regra.sql
        usa: [base_aparas.prod]

  - codigo: APARA_CONFIRMADA_PCT
    versao: 1
    nome: Apara confirmada
    unidade: pct
    grao: mes
    dono: Aparas
    definicao: >
      Scrap total da balança ÷ (peso bruto das REBs + scrap total) (medida
      "% PerdaConfirm. TOTAL" do BI Indicadores Produção). Scrap da Refugo Aparas
      (tabela HISTÓRICOPERDAS3), peso bruto da BASE_PROD.
    fonte_oficial: pbi_ind.perda_aparas
    tolerancia_abs: 0.05
    status_definicao: oficial
    notas: >
      O painel mostrava scrap ÷ produção (aba Percentual Scrap BI, SCRAP_PCT):
      mesmos números, sem o scrap no denominador (ago/2026: 17,14% x 14,63%).
    medicoes:
      - fonte: pbi_ind.perda_aparas
        regra: indicadores/apara_confirmada_bi_indicadores.sql
        usa: [pbi_ind.perda_aparas, pbi_ind.aparas_processo]
      - fonte: hub.calculo
        regra: indicadores/apara_confirmada_regra.sql
        usa: [refugo.aparas, base_aparas.prod]

  - codigo: ADERENCIA_PCT
    versao: 1
    nome: Aderência ao programado
    unidade: pct
    grao: mes x recorte
    dono: PCP
    definicao: >
      Quantidade produzida ÷ quantidade planejada, pelo mês de início planejado
      (medida "% Realizado Prog" do BI Indicadores Produção, página Ad. Plan
      Diária). Tabela ADERENCIA_BI da Aderência Semanal.
    fonte_oficial: pbi_ind.aderencia
    tolerancia_abs: 0.1
    faixa_max: 300                 # produzir mais que o planejado passa de 100%
    status_definicao: oficial
    medicoes:
      - fonte: pbi_ind.aderencia
        regra: indicadores/aderencia_bi_indicadores.sql
      - fonte: hub.calculo
        regra: indicadores/aderencia_planilha.sql
        usa: [aderencia.diaria]

  - codigo: PERDA_KG
    versao: 1
    nome: Perda apontada (kg)
    unidade: kg
    grao: mes x recorte
    dono: Aparas
    definicao: >
      Soma dos kg de perda apontados (código 40), a base do gráfico Perda por
      Motivos. Confere os dois BIs entre si e com a BASE_DETALHE do Base Aparas.
    fonte_oficial: pbi_ind.perda_sistemica
    tolerancia_pct: 0.005
    status_definicao: oficial
    medicoes:
      - fonte: pbi_ind.perda_sistemica
        regra: indicadores/perda_kg_bi_indicadores.sql
      - fonte: pbi.apontamentos
        regra: indicadores/perda_kg_bi_dados.sql
      - fonte: hub.calculo
        regra: indicadores/perda_kg_planilha.sql
        usa: [base_aparas.generico, base_aparas_2025.detalhe]

  # --- Conferências de planilha (não vão pro painel) ------------------------------
  - codigo: TMR_GRAFICOS_PCT
    versao: 1
    nome: TMR pela regra do Gráficos Tendência
    unidade: pct
    grao: mes x recorte
    dono: superior imediato de Produção
    definicao: >
      Horas classificadas como PRODUZINDO no cadastro oficial ÷ horas
      apontadas no recorte e no mês, sem as horas de FIM TURNO. Apontamentos
      do BI Dados de Produção (tabela Dados). É a regra do Gráficos Tendência;
      o painel usa a do BI (TMR_PCT).
    # Onde corrigir quando divergir: o cálculo do hub usa o dado completo do BI.
    correcao: "Gráficos Tendência › aba TMR - {recorte} › linha {mes} › coluna Produzindo = {valor_comparado}"
    fonte_oficial: graficos.tmr
    tolerancia_abs: 1.0            # pontos percentuais
    status_definicao: em_validacao
    notas: >
      Resolvido por evidência em 24/09: com os apontamentos do BI e FIM TURNO
      fora do total, o hub reproduz a planilha (Corte igual em todos os meses;
      R18, L04 e Roto com erro médio abaixo de 0,3 p.p.; Laminação = L02+L03+L04).
      A divergência vinha da Base Apontamento do Indicadores Diário, que está
      com apontamentos faltando — ver HORAS_APONTADAS.
      Flexo = R12 + R18 + R20 (definição do dono em 24/09; a R12 saiu em julho).
      Divergência que é da PLANILHA: em jan e fev o Gráficos Tendência deixou a
      R12 de fora do Flexo, mesmo com ela apontando. No Machine Card a R12
      está no grupo FUNGICIDA.
      Ainda a entender: Laminação em março (planilha 35,8% x 39,1%).
      Até 24/09 este era o TMR_PCT; em 25/09 o dono escolheu a regra do BI.
    medicoes:
      - fonte: graficos.tmr
        regra: indicadores/tmr_referencia.sql
      - fonte: hub.calculo
        regra: indicadores/tmr_hub.sql
        usa: [pbi.apontamentos, indicadores.classificacao]

  - codigo: SETUP_PCT
    versao: 1
    nome: Horas em setup
    unidade: pct
    grao: mes x recorte
    dono: superior imediato de Produção
    definicao: Horas com classe SETUP ÷ horas apontadas no recorte e no mês, sem FIM TURNO.
    correcao: "Gráficos Tendência › aba TMR - {recorte} › linha {mes} › coluna Setup = {valor_comparado}"
    fonte_oficial: graficos.tmr
    tolerancia_abs: 1.0
    status_definicao: em_validacao
    medicoes:
      - fonte: graficos.tmr
        regra: indicadores/setup_referencia.sql
      - fonte: hub.calculo
        regra: indicadores/setup_hub.sql
        usa: [pbi.apontamentos, indicadores.classificacao]

  - codigo: INATIVO_PCT
    versao: 1
    nome: Horas inativas
    unidade: pct
    grao: mes x recorte
    dono: superior imediato de Produção
    definicao: Horas com classe INATIVIDADE ÷ horas apontadas no recorte e no mês, sem FIM TURNO.
    correcao: "Gráficos Tendência › aba TMR - {recorte} › linha {mes} › coluna Inativo = {valor_comparado}"
    fonte_oficial: graficos.tmr
    tolerancia_abs: 1.0
    status_definicao: em_validacao
    medicoes:
      - fonte: graficos.tmr
        regra: indicadores/inativo_referencia.sql
      - fonte: hub.calculo
        regra: indicadores/inativo_hub.sql
        usa: [pbi.apontamentos, indicadores.classificacao]

  - codigo: HORAS_APONTADAS
    versao: 2
    nome: Horas apontadas (recorte da Base Apontamento)
    unidade: h
    grao: mes x recorte
    dono: superior imediato de Produção
    definicao: >
      Soma das horas dos apontamentos das máquinas do recorte no mês, sem
      parada sem OP, sem OP de WIP e sem revisão — o mesmo filtro da consulta
      "Base Apontamento" do Indicadores Diário. BI e planilha leem a mesma
      view do SQL Server: mês fechado precisa bater.
    fonte_oficial: pbi.apontamentos
    tolerancia_pct: 0.01           # 1%
    status_definicao: oficial
    notas: >
      v1 comparava o total de horas e divergia em 51 meses: a planilha descarta
      parada sem OP, WIP e revisão por construção (filtro do Power Query), não
      por falha. Com o mesmo filtro dos dois lados, 56 de 56 meses batem abaixo
      de 0,1%. Por isso a Base Apontamento NÃO serve pra TMR: ela não tem todo o
      tempo de máquina (o painel web atual calcula TMR em cima dela).
    medicoes:
      - fonte: pbi.apontamentos
        regra: indicadores/horas_bi.sql
      - fonte: indicadores.base_apontamento
        regra: indicadores/horas_excel.sql

  - codigo: VELOCIDADE_M_MIN
    versao: 2
    nome: Velocidade por OP (BI Dados de Produção)
    unidade: m_min
    grao: mes x maquina
    dono: superior imediato de Produção
    definicao: >
      Metros produzidos ÷ minutos produzindo, pela regra do BI Dados de
      Produção (consulta BaseVazao + medida Velocidade): por OP, processo e
      máquina, no mês do último dia da OP, sem OP de WIP ou revisão, sem OP com
      produção até 10 e sem OP sem hora produzindo.
    fonte_oficial: pbi.vazao
    tolerancia_pct: 0.01           # 1%
    status_definicao: oficial
    notas: >
      v1 comparava com a regra do painel web (Machine Card, por dia): outra
      definição, que diverge do BI em ~20% dos meses. A v2 recalcula a regra do
      BI a partir dos apontamentos do próprio BI: confere a tabela BaseVazao.
      O painel mostra a velocidade média do BI Indicadores Produção
      (VELOCIDADE_MEDIA_M_MIN), que é outra conta.
    medicoes:
      - fonte: pbi.vazao
        regra: indicadores/velocidade_bi.sql
      - fonte: hub.calculo
        regra: indicadores/velocidade_hub.sql
        usa: [pbi.apontamentos]

  - codigo: APARA_FARDOS_PCT
    versao: 1
    nome: Apara dos fardos
    unidade: pct
    grao: mes
    dono: Aparas
    definicao: >
      (Peso bruto − peso líquido) ÷ peso bruto dos fardos de aparas pesados no
      mês (JGR). Confere o Sequenciamento Acumulado com o arquivo do mês.
    fonte_oficial: sequenciamento.fardos
    tolerancia_abs: 0.1            # pontos percentuais
    comparacao_opcional: true      # o arquivo mensal só cobre o mês corrente
    status_definicao: oficial
    notas: >
      O histórico vem do Sequenciamento Acumulado (aba Base Aparas Total). O
      arquivo mensal é o mesmo registro, mais atual: nos meses em que os dois
      existem, precisam bater.
    medicoes:
      - fonte: sequenciamento.fardos
        regra: indicadores/apara_apontada_acumulado.sql
      - fonte: fardos.mensal
        regra: indicadores/apara_apontada_mensal.sql

  - codigo: PRODUCAO_KG
    versao: 1
    nome: Produção do mês
    unidade: kg
    grao: mes
    dono: superior imediato de Produção
    definicao: Produção total do mês em kg, como o Power BI fecha.
    correcao: "Gráficos Tendência › aba Volume (ton) › bloco Volume Corte (JGR + OF) › linha {mes} › kg = {valor_oficial}"
    fonte_oficial: sequenciamento.scrap_bi
    tolerancia_pct: 0.005          # 0,5%
    status_definicao: oficial
    notas: >
      O Gráficos Tendência copia esse número no bloco "Volume Corte (JGR + OF)".
      A comparação pega erro de cópia entre as duas planilhas.
    medicoes:
      - fonte: sequenciamento.scrap_bi
        regra: indicadores/producao_kg_bi.sql
      - fonte: graficos.volume_corte
        regra: indicadores/producao_kg_graficos.sql

  - codigo: SCRAP_PCT
    versao: 1
    nome: Scrap confirmado
    unidade: pct
    grao: mes
    dono: superior imediato de Produção
    definicao: Refugo total ÷ produção do mês, os dois como o Power BI fecha.
    fonte_oficial: sequenciamento.scrap_bi
    status_definicao: oficial
    notas: >
      Fonte única no MVP: conferidos só faixa (0–100%) e frescor. Não comparar
      com a apara de fardos: é outra definição, com escala 4 a 5 vezes menor.
      O BI Indicadores Produção põe o scrap também no denominador: é a apara
      confirmada que o painel mostra (APARA_CONFIRMADA_PCT).
    medicoes:
      - fonte: sequenciamento.scrap_bi
        regra: indicadores/scrap_pct_bi.sql
