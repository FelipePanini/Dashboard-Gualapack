[project]
name = "gualapack-data-hub"
version = "0.1.0"
description = "Data hub de produção da Gualapack Jaguariúna: coleta, valida e publica indicadores."
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1",
  "polars>=1.0",
  "fastexcel>=0.11",   # motor "calamine" do polars.read_excel — lê abas grandes em segundos
  "pyarrow>=16",       # troca de dados polars <-> duckdb
  "pyyaml>=6",
  "requests>=2.32",    # publicação no Supabase (HTTPS)
  "keyring>=25",       # senhas no Cofre de Credenciais do Windows, nunca em arquivo
  "pyodbc>=5",         # leitura do SQL Server (fase 2) com o driver que já vem no Windows
]

[project.scripts]
hub = "hub.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "xlsxwriter>=3.2.9",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hub"

[tool.pytest.ini_options]
testpaths = ["tests"]
